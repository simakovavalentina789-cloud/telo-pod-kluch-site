name: Repair approved IMPERIAL WOMEN cover
on:
  push:
    branches: [main]
    paths:
      - 'assets/imperial-women-cover.webp'
      - '.github/workflows/repair-imperial-cover.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact approved asset and verify content hash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib
          p=Path('assets/imperial-women-cover.webp')
          b=p.read_bytes()
          def sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          expected='f5bca29ac40f7cac9f89bbacd81c5f5d90cdf2dd'
          malformed='d370098ddadbb85125ebf1117211054b92007966'
          if sha(b)==expected:
              print('Approved cover already correct')
          elif sha(b)==malformed:
              encoded=base64.b64encode(b).decode()
              fixed=base64.b64decode(encoded[:5871]+'1'+encoded[5871:])
              assert sha(fixed)==expected, 'Reconstruction mismatch'
              p.write_bytes(fixed)
              print('Restored exact approved cover')
          else:
              raise ValueError('Unexpected cover content; refusing alteration')
          PY
      - name: Commit repaired image
        run: |
          if git diff --quiet -- assets/imperial-women-cover.webp; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/imperial-women-cover.webp
          git commit -m 'Restore approved IMPERIAL WOMEN editorial cover'
          git push origin HEAD:main
