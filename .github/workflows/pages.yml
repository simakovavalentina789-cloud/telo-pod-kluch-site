name: Publish TPK website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          test -d assets
          cp -R assets _site/assets
          test -s _site/assets/logo-vs.webp
          test -s _site/assets/hero-01-fish.webp
          test -s _site/assets/hero-02-steak.webp
          test -s _site/assets/hero-03-constructor.webp
          test -s _site/assets/valentina-schaste.jpg
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
