name: Publish TPK website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site before deployment
        run: |
          python3 scripts/check_site.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert len(scripts) == 1, "Expected exactly one inline script"
          Path("/tmp/tpk-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/tpk-inline.js
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp robots.txt sitemap.xml _site/
          test -d assets
          cp -R assets _site/assets
          test -s _site/assets/logo-vs.webp
          test -s _site/assets/hero-01-fish.webp
          test -s _site/assets/hero-02-steak.webp
          test -s _site/assets/hero-03-constructor.webp
          test -s _site/assets/valentina-schaste.jpg
          test -s _site/assets/case-muscle.webp
          test -s _site/assets/case-weight.webp
          test -s _site/assets/case-maintain.webp
          test -s _site/assets/case-recomposition.webp
          touch _site/.nojekyll
      - name: Functional browser acceptance — diagnostic, must not take website offline
        continue-on-error: true
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.56.1
          node scripts/smoke.mjs
      - name: Capture responsive previews and food gallery (diagnostic)
        continue-on-error: true
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo "FAIL: Chrome not installed on runner"; exit 1; fi
          mkdir -p screenshots
          PAGE="file://$(pwd)/_site/index.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=390,3900 --screenshot=screenshots/mobile.png "$PAGE"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=820,3350 --screenshot=screenshots/ipad.png "$PAGE"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=1440,2300 --screenshot=screenshots/desktop.png "$PAGE"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=7000 --window-size=820,1180 --screenshot=screenshots/app-ipad.png "$PAGE#app"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=7000 --window-size=390,980 --screenshot=screenshots/app-mobile.png "$PAGE#app"
          test -s screenshots/app-ipad.png
          test -s screenshots/app-mobile.png
      - name: Upload browser preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-responsive-preview
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
