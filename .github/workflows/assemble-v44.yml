name: Assemble approved V44 visual
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-v44.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble supplied approved design
        run: |
          python3 - <<'PY'
          import base64,hashlib
          from pathlib import Path
          items=sorted(Path("assets/.v44-parts").glob("*.txt"))
          assert len(items)==5, f"Missing image chunks: {len(items)}"
          encoded="".join(p.read_text().strip() for p in items)
          raw=base64.b64decode(encoded,validate=True)
          sha=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          assert sha=="67480fbbbd76eda99c7293cb9f15247e2c75af01", f"Image corrupted: {sha}"
          dest=Path("assets/v44-approved-menu.webp")
          dest.write_bytes(raw)
          print(f"Approved screenshot saved: {dest} {len(raw)} bytes")
          PY
      - name: Commit optimized web image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/v44-approved-menu.webp
          git commit -m 'V44 upload exact approved visual as optimized WebP'
          git push origin HEAD:main
